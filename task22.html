<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Element Selector */
        h1 {
            color: blue;
        }

        /* Class Selector */
        .special {
            color: green;
            font-size: 20px;
        }

        /* ID Selector */
        #unique {
            color: red;
            background-color: lightyellow;
        }

    </style>
</head>

<body>

    <h1>Element Selector</h1>

    <p class="special">
    full stack developer
    </p>

    <p id="unique">
        web developer
    </p>

    <p>
        software developer
    </p>

</body>
</html>
